<!DOCTYPE html>
<html>
<head>
<title>Mock Game</title>
<style>
  body { font-family: sans-serif; }
  .game-bet-history-item {
    width: 200px;
    height: 25px;
    border: 1px solid #ccc;
    margin-bottom: 5px;
    padding: 2px;
  }
  .game-bet-button {
    width: 120px;
    height: 60px;
    background-color: #f0f0f0;
    border: 1px solid #999;
    cursor: pointer;
    font-size: 16px;
    margin: 20px;
  }
  #click-log {
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #ddd;
    background-color: #fafafa;
  }
</style>
</head>
<body>
  <h1>Mock Game Interface for Coordinate Click Test</h1>
  <p>Place the action buttons over the 'BET' buttons below to test.</p>

  <div id="bet-history">
    <div class="game-bet-history-item" style="background-color: rgb(100, 200, 100);">Green Item 1</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
    <div class="game-bet-history-item" style="background-color: rgb(120, 220, 120);">Green Item 2</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
    <div class="game-bet-history-item" style="background-color: rgb(144, 238, 144);">Green Item 3</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
    <div class="game-bet-history-item" style="background-color: #ffffff;">White Item</div>
  </div>

  <div id="betting-controls">
    <button class="game-bet-button" onclick="logClick('Bet 1')">BET 1</button>
    <button class="game-bet-button" onclick="logClick('Bet 2')">BET 2</button>
  </div>

  <div id="click-log">
    <strong>Click Log:</strong>
    <ul id="log-list"></ul>
  </div>

  <script>
    function logClick(buttonName) {
      const logList = document.getElementById('log-list');
      const newItem = document.createElement('li');
      newItem.textContent = `${buttonName} clicked at ${new Date().toLocaleTimeString()}`;
      logList.appendChild(newItem);
    }
  </script>
</body>
</html>
